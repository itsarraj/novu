# Shared dependency stack for Novu (Mongo, Redis, LocalStack S3, ClickHouse).
# Used by `docker-compose.full.yml` (`include`) and can be run alone for hybrid dev.
#
# Optional port overrides: copy `.env.deps.example` → `.env.deps` and pass:
#   docker compose --env-file .env.deps -f docker-compose.yml up -d

services:
  mongo:
    image: mongo:8.0.17
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-novu-db}
    ports:
      - "${DOCKER_MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    ports:
      - "${DOCKER_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # S3 emulation (used by local / docker envs: S3_LOCAL_STACK=http://localstack:4566)
  localstack:
    image: localstack/localstack:3.8.1
    restart: unless-stopped
    environment:
      SERVICES: s3
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      - "${DOCKER_LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Analytics / logs (CLICK_HOUSE_URL=http://clickhouse:8123 in .env.docker)
  clickhouse:
    image: clickhouse/clickhouse-server:24.8.14.39-alpine
    restart: unless-stopped
    # Official image disables network access for user `default` unless a password is set;
    # host / bridge clients then get AUTHENTICATION_FAILED. See Docker Hub "Managing default user".
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "${DOCKER_CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${DOCKER_CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  mongodb-data:
  redis-data:
  localstack-data:
  clickhouse-data:
